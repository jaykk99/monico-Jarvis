app = 'monico-jarvis'
primary_region = 'ord'

# Builds the Dockerfile in this repo (runs uvicorn on port 8000).
[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'
