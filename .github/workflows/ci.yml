name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: tests
        run: pytest tests/ -q
      - name: boot smoke test
        run: |
          python -m uvicorn main:app --port 8123 &
          SRV=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8123/ready && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8123/health
          curl -sf -X POST http://127.0.0.1:8123/chat \
            -H 'Content-Type: application/json' \
            -d '{"query":"help"}'
          kill $SRV
