<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<title>Jarvis — Monico</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="side-brand">
      <div class="core"><span></span></div>
      <div class="side-brand-text">
        <h1>JARVIS</h1>
        <p>monico · local</p>
      </div>
      <button class="side-close" id="side-close" aria-label="Close menu">✕</button>
    </div>

    <div class="side-status" id="side-status">
      <span class="dot"></span><span id="status-text">connecting…</span>
    </div>

    <div class="side-section">
      <h2>Skills</h2>
      <input id="skill-search" class="skill-search" type="search"
             placeholder="filter skills…" aria-label="Filter skills" autocomplete="off">
      <div class="skill-grid" id="skill-grid"></div>
    </div>

    <div class="side-section side-foot">
      <h2>About</h2>
      <p class="side-note">Every skill runs on this box. No API keys, no network calls, nothing leaves your device.</p>
      <div class="chips" id="chips"></div>
    </div>
  </aside>
  <div class="side-scrim" id="side-scrim"></div>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menu-btn" aria-label="Open skills menu">☰</button>
      <div class="topbar-title">
        <span class="topbar-dot" id="topbar-dot"></span>
        <span id="topbar-status">Jarvis</span>
      </div>
      <label class="tts-toggle" title="Speak replies aloud">
        <input type="checkbox" id="tts">
        <span class="tts-pill">🔊 voice replies</span>
      </label>
      <select id="tts-voice" class="tts-voice" title="Voice for spoken replies" hidden></select>
      <button class="icon-btn" id="theme-btn" title="Toggle light/dark theme" aria-label="Toggle theme">◐</button>
      <button class="icon-btn" id="export-btn" title="Download chat log" aria-label="Export chat">⤓</button>
      <button class="icon-btn" id="clear-btn" title="Clear chat" aria-label="Clear chat">🧹</button>
    </header>

    <section class="wave-wrap" aria-hidden="true">
      <canvas id="wave"></canvas>
      <div class="wave-label" id="wave-label">READY</div>
    </section>

    <section class="log" id="log" aria-live="polite"></section>

    <section class="hints" id="hints"></section>

    <footer class="composer-wrap">
      <form class="composer" id="composer" autocomplete="off">
        <button type="button" class="mic" id="mic" aria-label="Voice input">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
        <input id="input" type="text" placeholder="Ask Jarvis… try “help”" maxlength="2000" enterkeyhint="send">
        <button type="submit" class="send" id="send" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </form>
      <div class="voice-note" id="voice-note" hidden></div>
      <p class="foot-note">keyless · local only · <button type="button" class="link-btn" id="help-btn">commands</button></p>
    </footer>
  </main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
